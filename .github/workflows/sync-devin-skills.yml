name: Sync Devin skills

on:
  push:
    branches: [main]
    paths:
      - "plugins/powerups/skills/**"
      - "scripts/sync-devin-skills.py"
      - ".github/workflows/sync-devin-skills.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-devin-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync-devin-skills.py
      - name: Commit mirror
        run: |
          if git diff --quiet -- .agents/skills; then
            echo "mirror already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills
          git commit -m "chore: sync .agents/skills from powerups plugin skills"
          git push
